app = "turing-game"
primary_region = "sjc"

[build]

[env]
  PORT = "8080"
  TURING_MODEL = "claude-haiku-4-5"
  TURING_SECONDS = "90"

# Games live in memory, so run exactly one machine and keep it up.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
